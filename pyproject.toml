[project]
name = "project-m"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "adityadebnath009", email = "debnathaditya2005@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.0.0",
    "mcp>=2.1.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
project-m = "project_m:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
