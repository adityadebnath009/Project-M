<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg-radial" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1E1610" />
      <stop offset="60%" stop-color="#0C0E12" />
      <stop offset="100%" stop-color="#07080A" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-radial)" />
  
  <!-- Subtle Grid Accent -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Glow behind Logo -->
  <circle cx="600" cy="220" r="260" fill="url(#glow)" />

  <!-- The Exact Project-M Logo from Repository -->
  <image href="data:image/png;base64," x="460" y="110" width="280" height="198" preserveAspectRatio="xMidYMid meet" />

  <!-- Badge Pill -->
  <g transform="translate(485, 335)">
    <rect width="230" height="34" rx="17" fill="#271C12" stroke="#D97706" stroke-width="1.5" />
    <circle cx="22" cy="17" r="4" fill="#10B981" />
    <text x="36" y="22" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">PROJECT-M  •  v0.2.0</text>
  </g>

  <!-- Headline -->
  <text x="600" y="425" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
    Newer versions with new features
  </text>
  <text x="600" y="480" text-anchor="middle" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
    are coming soon.
  </text>

  <!-- Subtitle -->
  <text x="600" y="540" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0.2">
    Ambient Context Engine  •  Autonomous Watchers  •  Multi-Agent Collaboration
  </text>

  <!-- Bottom dots -->
  <g transform="translate(510, 580)">
    <circle cx="0" cy="0" r="4" fill="#F59E0B" />
    <circle cx="25" cy="0" r="4" fill="#F97316" />
    <circle cx="50" cy="0" r="4" fill="#EF4444" />
    <circle cx="75" cy="0" r="4" fill="#EC4899" />
    <circle cx="100" cy="0" r="4" fill="#8B5CF6" />
    <circle cx="125" cy="0" r="4" fill="#3B82F6" />
    <circle cx="150" cy="0" r="4" fill="#10B981" />
    <circle cx="175" cy="0" r="4" fill="#FFFFFF" />
  </g>
</svg>